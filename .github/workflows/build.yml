name: Musick Windows build

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Paket sürümü (örn. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/MusicBot.Web/clientapp/package-lock.json
      - name: Sürümü doğrula
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } elseif ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { '1.0.0' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Geçersiz sürüm' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Test et ve paketle
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/Package-Release.ps1 -Version $env:RELEASE_VERSION -Runtime win-x64
      - name: Kurulumu artifact olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: Musick-win-x64
          path: |
            artifacts/**/Musick-Setup.exe
            artifacts/**/releases/*
          retention-days: 14
      - name: Taslak Release oluştur
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Musick ${{ steps.version.outputs.version }} — by SertAy
          generate_release_notes: true
          files: |
            artifacts/**/Musick-Setup.exe
            artifacts/**/releases/*.nupkg
            artifacts/**/releases/releases.win.json
            artifacts/**/releases/RELEASES
